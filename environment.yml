name: qiime2-amplicon-2024.2
channels:
  - https://packages.qiime2.org/qiime2/2024.2/amplicon/released
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # QIIME2 Core (versión completa)
  - qiime2=2024.2.*
  - q2cli=2024.2.*

  # QIIME2 Plugins - TODOS los necesarios
  - q2-demux=2024.2.*
  - q2-feature-table=2024.2.*
  - q2-taxa=2024.2.*
  - q2-deblur=2024.2.*
  - q2-quality-control=2024.2.*
  - q2-quality-filter=2024.2.*
  - q2-diversity=2024.2.*
  - q2-feature-classifier=2024.2.*
  - q2-phylogeny=2024.2.*
  - q2-alignment=2024.2.*

  # Herramientas bioinformáticas
  - picrust2=2.5.*
  - vsearch>=2.22
  - cutadapt>=4.0
  - fastqc
  - biom-format>=2.1

  # Python y librerías científicas
  - python=3.8.*
  - pandas>=1.3
  - numpy>=1.20
  - matplotlib>=3.5
  - seaborn>=0.11
  - scipy>=1.7
  - biopython>=1.79
  - click>=8.0

  # Utilidades
  - wget
  - curl
  - git
  - pip