name: qiime2-amplicon-2024.2
channels:
  - picrust
  - https://packages.qiime2.org/qiime2/2024.2/amplicon/released
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # QIIME2 Core
  - qiime2=2024.2
  - q2cli=2024.2
  - q2-types=2024.2
  - q2-feature-table=2024.2
  - q2-diversity=2024.2
  - q2-taxa=2024.2
  - q2-phylogeny=2024.2
  - q2-deblur=2024.2
  - q2-dada2=2024.2
  - q2-quality-control=2024.2
  - q2-quality-filter=2024.2
  - q2-vsearch=2024.2
  - q2-feature-classifier=2024.2
  - q2-picrust2=2023.2

  # PICRUSt2 y análisis metabólico
  - picrust2=2.5.2
  - biom-format=2.1.14
  - hpp
  - hdf5
  - gappa=0.8.0
  - epa-ng=0.3.8

  # Herramientas bioinformáticas esenciales
  - fastqc
  - multiqc
  - cutadapt=4.6
  - vsearch=2.22.1
  - mafft=7.520
  - fasttree=2.1.11
  - iqtree=2.2.6
  - raxml=8.2.13
  - blast=2.15.0
  - hmmer=3.1b2
  - sepp=4.3.10

  # Python packages principales
  - python=3.8.15
  - pandas=1.5.3
  - numpy=1.24.4
  - scipy=1.10.0
  - matplotlib=3.6.0
  - seaborn=0.12.2
  - scikit-learn=0.24.1
  - scikit-bio=0.5.8
  - biopython=1.83
  - click=8.1.7
  - jupyter
  - jupyterlab

  # Herramientas de descarga y datos
  - sra-tools=3.1.0
  - entrez-direct=16.2
  - wget
  - curl

  # Utilidades del sistema
  - pigz=2.8
  - pbzip2=1.1.13
  - parallel

  # R y paquetes para análisis estadístico
  - r-base=4.2.2
  - r-vegan=2.6_4
  - r-ggplot2=3.5.0
  - r-dplyr=1.1.4
  - r-tidyverse=2.0.0
  - r-phyloseq=1.42.0

  # Dependencias específicas de QIIME2
  - deblur=1.1.1
  - rescript=2024.2.2
  - unifrac=1.3
  - emperor=1.1.0