# QIIME2 Amplicon 2024.2 Environment
#
# Official QIIME2 2024.2 distribution with additional tools
#
# Installation:
#   1. Set channel priority to flexible (REQUIRED):
#      conda config --set channel_priority flexible
#
#   2. Create environment:
#      conda env create -f environment.yml
#
#   3. Activate:
#      conda activate qiime2-amplicon-2024.2
#
# Or use the automated setup.sh script for best results.

name: qiime2-amplicon-2024.2

channels:
  - https://packages.qiime2.org/qiime2/2024.2/amplicon/released
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Base QIIME2 2024.2 Amplicon Distribution
  # All QIIME2 plugins are included in this meta-package
  - qiime2-amplicon=2024.2.*

  # Additional microbiome analysis tools
  - picrust2
  - sra-tools

  # Python packages
  - pip
  - pip:
    - dokdo